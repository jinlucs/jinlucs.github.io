name: Update publications from BibTeX

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "assets/bib/**"
      - "scripts/update_publications.py"
      - "scripts/requirements.txt"
      - ".github/workflows/self-evolve.yml"

permissions:
  contents: write

concurrency:
  group: publications-update
  cancel-in-progress: false

jobs:
  publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Update publications from BibTeX
        run: python scripts/update_publications.py --bib assets/bib/publications.bib --out _data/publications.yml --me "Jin Lu"
      - name: Commit publication changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- _data/publications.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update publications from BibTeX"
            git pull --rebase
            git push
          fi
